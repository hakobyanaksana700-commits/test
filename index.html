<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Привет Оксана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    color: #fff;
  }
  .hero {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background-image: url('assets/hero-bg.svg');
    background-size: cover;
    background-position: center;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.75) 100%);
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 0 1.5rem;
  }
  .eyebrow {
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-size: 0.8rem;
    font-weight: 300;
    opacity: 0.85;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    margin: 0 0 1rem;
    text-shadow: 0 6px 24px rgba(0,0,0,0.35);
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-weight: 300;
    font-size: 1.15rem;
    opacity: 0.9;
    max-width: 32rem;
    margin: 0 auto 2.5rem;
    line-height: 1.6;
  }
  button {
    padding: 1rem 2.8rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    background: transparent;
    border: 1px solid #fff;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
  }
  button:hover {
    background: #fff;
    color: #1a1a1a;
    transform: translateY(-2px);
  }
  button:active {
    transform: translateY(0);
  }
  #message {
    margin-top: 1.8rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    min-height: 2rem;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #message.show {
    opacity: 1;
  }
  .signature {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.9rem;
    opacity: 0.7;
    z-index: 1;
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="content">
      <div class="eyebrow">Photography &amp; Moments</div>
      <h1>Привет, Оксана</h1>
      <p class="subtitle">Каждый кадр — это история. Пусть этот день станет одним из самых тёплых воспоминаний.</p>
      <button onclick="const m = document.getElementById('message'); m.textContent = '✨ Отличного дня, Оксана! ✨'; m.classList.add('show');">нажми меня</button>
      <div id="message"></div>
    </div>
    <div class="signature">— с любовью, для тебя</div>
  </section>
</body>
</html>
