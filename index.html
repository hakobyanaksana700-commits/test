<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Привет Оксана</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a18cd1 100%);
    text-align: center;
  }
  h1 {
    font-size: 4.5rem;
    color: #fff;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    margin: 0;
  }
  button {
    padding: 1rem 2.5rem;
    font-size: 1.3rem;
    font-weight: bold;
    color: #a18cd1;
    background: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
  }
  button:active {
    transform: translateY(0) scale(0.98);
  }
  #message {
    font-size: 1.4rem;
    color: #fff;
    min-height: 2rem;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>
  <h1>Привет, Оксана</h1>
  <button onclick="document.getElementById('message').textContent = '✨ Отличного дня, Оксана! ✨'">нажми меня</button>
  <div id="message"></div>
</body>
</html>
