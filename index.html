<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Привет Оксана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    color: #fff;
  }
  .hero {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background-image: url('assets/hero-bg.svg');
    background-size: cover;
    background-position: center;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.75) 100%);
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 0 1.5rem;
  }
  .eyebrow {
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-size: 0.8rem;
    font-weight: 300;
    opacity: 0.85;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    margin: 0 0 1rem;
    text-shadow: 0 6px 24px rgba(0,0,0,0.35);
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-weight: 300;
    font-size: 1.15rem;
    opacity: 0.9;
    max-width: 32rem;
    margin: 0 auto 2.5rem;
    line-height: 1.6;
  }
  .buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    padding: 1rem 2.8rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    background: transparent;
    border: 1px solid #fff;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
  }
  button:hover {
    background: #fff;
    color: #1a1a1a;
    transform: translateY(-2px);
  }
  button:active {
    transform: translateY(0);
  }
  .btn-solid {
    background: #f0a868;
    border-color: #f0a868;
    color: #2b1e3d;
  }
  .btn-solid:hover {
    background: #ffd9a0;
    border-color: #ffd9a0;
    color: #2b1e3d;
  }
  #message {
    margin-top: 1.8rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    min-height: 2rem;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #message.show {
    opacity: 1;
  }
  .signature {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.9rem;
    opacity: 0.7;
    z-index: 1;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 10, 20, 0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .modal-overlay.show {
    opacity: 1;
    visibility: visible;
  }
  .modal-box {
    position: relative;
    max-width: 26rem;
    margin: 1.5rem;
    padding: 3rem 2.5rem;
    text-align: center;
    color: #fff;
    background: linear-gradient(160deg, rgba(90, 53, 86, 0.95), rgba(43, 30, 61, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    transform: scale(0.85) translateY(20px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
  }
  .modal-overlay.show .modal-box {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .modal-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }
  .modal-box h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 0.8rem;
  }
  .modal-box p {
    font-weight: 300;
    line-height: 1.6;
    opacity: 0.9;
    margin: 0;
  }
  .modal-close {
    position: absolute;
    top: 0.9rem;
    right: 1rem;
    width: auto;
    padding: 0;
    border: none;
    background: none;
    color: #fff;
    font-size: 1.4rem;
    line-height: 1;
    opacity: 0.7;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .modal-close:hover {
    opacity: 1;
    background: none;
    color: #fff;
    transform: rotate(90deg);
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="content">
      <div class="eyebrow">Photography &amp; Moments</div>
      <h1>Привет, Оксана</h1>
      <p class="subtitle">Каждый кадр — это история. Пусть этот день станет одним из самых тёплых воспоминаний.</p>
      <div class="buttons">
        <button onclick="const m = document.getElementById('message'); m.textContent = '✨ Отличного дня, Оксана! ✨'; m.classList.add('show');">нажми меня</button>
        <button class="btn-solid" onclick="document.getElementById('portfolioModal').classList.add('show')">посмотреть портфолио</button>
      </div>
      <div id="message"></div>
    </div>
    <div class="signature">— с любовью, для тебя</div>
  </section>

  <div class="modal-overlay" id="portfolioModal" onclick="if (event.target === this) this.classList.remove('show')">
    <div class="modal-box">
      <button class="modal-close" onclick="document.getElementById('portfolioModal').classList.remove('show')" aria-label="Закрыть">&times;</button>
      <div class="modal-icon">📷</div>
      <h2>Портфолио в разработке</h2>
      <p>Портфолио Оксаны скоро будет здесь</p>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('portfolioModal').classList.remove('show');
      }
    });
  </script>
</body>
</html>
